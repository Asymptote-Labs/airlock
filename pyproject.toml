[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "airlock-context"
version = "0.1.0"
description = "Encrypted files, natural-language access policies, and scoped answers for AI agents"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "python-multipart>=0.0.20", "cryptography>=44", "openai>=2", "httpx>=0.28", "mcp>=1.9,<2"]

[project.optional-dependencies]
test = ["pytest>=8", "ruff>=0.11"]

[project.urls]
Repository = "https://github.com/Asymptote-Labs/airlock"
Issues = "https://github.com/Asymptote-Labs/airlock/issues"

[project.scripts]
airlock = "airlock.cli:main"

[tool.setuptools.packages.find]
include = ["airlock*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
